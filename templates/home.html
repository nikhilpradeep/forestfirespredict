<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7f6;
            color: #1f2933;
        }

        .container {
            max-width: 760px;
            margin: 40px auto;
            padding: 28px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #12343b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #0f766e;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        .result {
            margin-top: 24px;
            padding: 14px;
            border-radius: 6px;
            background: #ecfdf5;
            color: #065f46;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .container {
                margin: 20px;
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>FWI Ridge Prediction</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="form-grid">
                <div>
                    <label for="Temperature">Temperature</label>
                    <input type="number" id="Temperature" name="Temperature" step="any" required>
                </div>

                <div>
                    <label for="RH">Relative Humidity</label>
                    <input type="number" id="RH" name="RH" step="any" required>
                </div>

                <div>
                    <label for="Ws">Wind Speed</label>
                    <input type="number" id="Ws" name="Ws" step="any" required>
                </div>

                <div>
                    <label for="Rain">Rain</label>
                    <input type="number" id="Rain" name="Rain" step="any" required>
                </div>

                <div>
                    <label for="FFMC">FFMC</label>
                    <input type="number" id="FFMC" name="FFMC" step="any" required>
                </div>

                <div>
                    <label for="DMC">DMC</label>
                    <input type="number" id="DMC" name="DMC" step="any" required>
                </div>

                <div>
                    <label for="ISI">ISI</label>
                    <input type="number" id="ISI" name="ISI" step="any" required>
                </div>

                <div>
                    <label for="Classes">Fire Class</label>
                    <select id="Classes" name="Classes" required>
                        <option value="">Select class</option>
                        <option value="0">Not Fire</option>
                        <option value="1">Fire</option>
                    </select>
                </div>

                <div>
                    <label for="Region">Region</label>
                    <select id="Region" name="Region" required>
                        <option value="">Select region</option>
                        <option value="0">Bejaia</option>
                        <option value="1">Sidi-Bel Abbes</option>
                    </select>
                </div>
            </div>

            <button type="submit">Predict FWI</button>
        </form>

        {% if results is defined %}
            <div class="result">
                Predicted FWI: {{ results }}
            </div>
        {% endif %}
    </main>
</body>
</html>
